<section class="dashboard">

    <header class="dashboard-header">

        <div>

            <h1>Dashboard</h1>

            <p>Visão geral dos contratos</p>

        </div>

    </header>

    <section class="dashboard-cards">

        <div id="card-total"></div>
        <div id="card-active"></div>
        <div id="card-expiring"></div>
        <div id="card-expired"></div>
        <div id="card-value"></div>

    </section>

    <section class="dashboard-panels">

        <section class="fx-panel">

            <div class="fx-panel-header">

                <h3>Contratos por Tipo</h3>

            </div>

            <div class="fx-panel-body">

                <div id="contracts-chart" class="fx-chart"></div>

            </div>

        </section>

        <section class="fx-panel">

            <div class="fx-panel-header">

                <h3>Próximos Vencimentos</h3>

            </div>

            <div class="contracts-list">

                <div id="next-contracts"></div>

            </div>

        </section>

        <section class="fx-panel">

            <div class="fx-panel-header">

                <h3>Contratos por Status</h3>

            </div>

            <div class="fx-panel-body">

                <div id="status-chart" class="fx-chart"></div>

            </div>

        </section>

    </section>

</section>
